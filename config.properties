# ============================================================
#  Discord Virtual Stock Market - configuration
#  Any key can be overridden by an env var: dots -> underscores, uppercase
#  (e.g. discord.token -> DISCORD_TOKEN)
# ============================================================

# --- Discord ---------------------------------------------------
discord.token=
# Optional: market announcements channel (falls back to the affected channel)
announce.channel.id=
# Comma-separated channel IDs that must never become stocks
excluded.channel.ids=

# --- Database --------------------------------------------------
database.url=jdbc:sqlite:stockmarket.db

# --- Economy ---------------------------------------------------
economy.starting.cash=1000
economy.daily.bonus=200
economy.daily.cooldown.hours=24
# Fee charged on SALES only (0.02 = 2%)
economy.sell.fee=0.02

# --- Stock engine ----------------------------------------------
stock.initial.price=10.00
stock.min.price=0.10
stock.tick.seconds=60
# Quiet-channel decay per tick (0.0003 = 0.03% per minute)
stock.decay.per.tick=0.0003
# Growth per tick = coefficient * ln(1 + activity score)
stock.growth.coefficient=0.004
# Hard cap on ORGANIC growth inside one window
stock.max.growth.per.window=0.10
stock.window.minutes=10
stock.snapshot.minutes=10

# --- Anti-manipulation -----------------------------------------
antispam.cooldown.seconds=30
antispam.min.length=5
antispam.duplicate.window.minutes=10
antispam.unique.window.minutes=10
# Price gains require at least this many unique chatters in the window
antispam.min.unique.chatters=2

# Circuit breaker: volume spike with too few unique chatters freezes gains
breaker.min.messages=8
breaker.spike.ratio=4.0
breaker.min.unique.chatters=4
breaker.freeze.minutes=10

# --- Market events ---------------------------------------------
events.check.interval.minutes=10
events.random.chance=0.07
events.default.duration.minutes=15
events.max.concurrent.per.guild=3

events.boom.min.pct=20
events.boom.max.pct=50
events.crash.min.pct=15
events.crash.max.pct=40
events.boom.activity.multiplier=2.0
events.rally.activity.multiplier=1.5
events.crash.decay.multiplier=3.0
events.bear.decay.multiplier=2.5
